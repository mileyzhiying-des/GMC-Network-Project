<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GMC Network · Reservasi / 预约</title>
<link rel="stylesheet" href="/shared/app.css">
<style>
  body{background:var(--bg,#F4F6F9);}
  .bk-wrap{max-width:480px;margin:0 auto;padding:16px 16px 130px;min-height:100vh;display:flex;flex-direction:column;gap:14px;}
  .bk-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .bk-lang{flex-shrink:0;}
  .bk-lang{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:#fff;}
  .bk-lang button{white-space:nowrap;border:0;background:transparent;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--slate2);font-family:inherit;}
  .bk-lang button.on{background:var(--navy);color:#fff;font-weight:700;}
  .bk-card{background:#fff;border-radius:16px;padding:20px 18px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .bk-title{font-size:17px;font-weight:700;margin-bottom:4px;}
  .bk-sub{font-size:12px;color:var(--slate2);line-height:1.6;margin-bottom:14px;}
  .bk-step{font-size:11px;color:var(--muted);margin-bottom:6px;}
  .bk-bar{height:4px;background:var(--border2);border-radius:4px;margin-bottom:14px;overflow:hidden;}
  .bk-bar span{display:block;height:100%;background:var(--navy);}
  .bk-days{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;}
  .bk-day{flex:0 0 auto;min-width:58px;padding:8px 6px;border:1px solid var(--border);border-radius:12px;text-align:center;font-size:12px;cursor:pointer;background:#fff;}
  .bk-day b{display:block;font-size:16px;}
  .bk-day.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .bk-day.off{background:var(--border2);color:var(--dim);cursor:default;}
  .bk-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .bk-slot{min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;border:1px solid var(--border);border-radius:10px;text-align:center;font-size:13px;cursor:pointer;background:#fff;}
  .bk-slot.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700;}
  .bk-slot.off{background:var(--border2);color:var(--dim);cursor:default;}
  .bk-slot.full{background:#fff;color:var(--muted);cursor:default;} /* 已满：白底，只标小字「已满」 */
  .bk-slot small{display:block;font-size:10px;}
  .bk-field{margin-bottom:12px;}
  .bk-field label{display:block;font-size:12px;color:var(--slate2);margin-bottom:5px;}
  .bk-field input[type=text],.bk-field input[type=tel],.bk-field input[type=date],.bk-field input[type=month],.bk-field select,.bk-field textarea{width:100%;min-height:50px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;font-size:16px;font-family:inherit;background:#fff;box-sizing:border-box;} /* 16px 避免 iOS 聚焦时放大页面；输入框够大手指点得到 */
  .phone-row select,.phone-row input{min-height:50px;font-size:16px;border-radius:12px;box-sizing:border-box;}
  .bk-btn{width:100%;min-height:52px;padding:14px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
  .bk-btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--border);margin-top:8px;font-weight:400;}
  .bk-btn.danger{background:#C1454A;}
  .bk-footer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--border);padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.06);}
  .bk-footer-row{max-width:448px;margin:0 auto;display:flex;gap:10px;}
  .bk-footer-row .bk-btn{margin:0;flex:1;}
  .bk-footer-row .bk-btn.ghost{flex:0 0 38%;white-space:nowrap;font-size:14px;padding-left:6px;padding-right:6px;}
  .bk-br{border:1px solid var(--border);border-radius:14px;padding:12px 14px 2px;margin-bottom:12px;background:#FCFCFD;}
  .bk-br-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .bk-x{border:0;background:var(--border2);color:var(--slate2);width:36px;height:36px;border-radius:50%;font-size:15px;cursor:pointer;}
  .bk-btn:disabled{opacity:.4;cursor:default;}
  .bk-err{color:#C1454A;font-size:12px;margin:0 0 10px;line-height:1.6;}
  .bk-info{background:var(--border2);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.7;color:var(--slate2);margin-bottom:12px;}
  .bk-demo{background:#FBF0C9;color:#8F6F0C;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.7;margin-bottom:12px;}
  .bk-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border2);font-size:13px;}
  .bk-row span:first-child{color:var(--muted);flex-shrink:0;}
  .bk-radio{display:flex;align-items:center;gap:10px;min-height:52px;padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;font-size:14px;cursor:pointer;background:#fff;}
  .bk-radio.on{border-color:var(--navy);background:#F1F4F8;font-weight:700;}
  .bk-check{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.6;margin-bottom:12px;padding:10px 4px;cursor:pointer;}
  .bk-check input{width:24px;height:24px;flex-shrink:0;margin:0;}
  .bk-sms{background:#F1F4F8;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.7;color:var(--slate2);white-space:pre-wrap;word-break:break-all;}
</style>
<script>
/* 不要双击 html 打开：共享脚本用 /shared/ 绝对路径，file:// 下加载不到，各页面之间也不共用数据；请双击项目根目录的 start.command，用 http://localhost:3000 打开（所有页面必须用同一个地址，localhost 和 127.0.0.1 的数据是分开的） */
if(location.protocol==='file:'){ document.addEventListener('DOMContentLoaded', function(){ var d=document.createElement('div'); d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#C1454A;color:#fff;padding:14px 18px;font-size:14px;line-height:1.7;text-align:center;'; d.innerHTML='⚠️ 你是直接双击打开的网页，这样页面会不完整、各分页之间也不会同步。请关掉它，双击项目文件夹里的 <b>start.command</b>，用 <b>http://localhost:3000</b> 打开。'; document.body.appendChild(d); }); }
</script>
</head>
<body>
<div class="bk-wrap">
  <div class="bk-head"><div><span class="logo">GMC Network</span> <span class="logo-sub" id="bk-sub"></span></div>
    <div class="bk-lang"><button id="lang-id" onclick="bkSetLang('id')">Bahasa Indonesia</button><button id="lang-zh" onclick="bkSetLang('zh')">中文</button></div></div>
  <div id="bk-root"></div>
</div>
<div id="toast-stack"></div>
<script src="/shared/rules.js"></script>
<script src="/shared/i18n.js"></script>
<script src="/shared/ui.js"></script>
<script src="/shared/data.js"></script>
<script src="/shared/store.js"></script>
<script src="/shared/booking.js"></script>
</body>
</html>
