<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手机预览 · 客户预约页</title>
<!-- 手机预览（CMD-1008-12 B4）：用手机外框（宽 390px）显示客户预约页，页面在 iframe 里，可完整操作；数据和其他分页共用同一份存档 -->
<style>
  body{margin:0;min-height:100vh;background:#DDD8CC;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;}
  .phone{position:relative;width:390px;height:min(844px, calc(100vh - 48px));background:#111;border-radius:48px;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.35);box-sizing:content-box;margin:24px 0;}
  .phone::before{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#111;border-radius:0 0 18px 18px;z-index:2;}
  .phone iframe{width:390px;height:100%;border:0;border-radius:38px;background:#fff;display:block;}
  .tip{position:fixed;left:16px;bottom:12px;font-size:12px;color:#6B6A63;}
</style>
</head>
<body>
<div class="phone"><iframe src="/booking.html" title="客户预约页（手机）"></iframe></div>
<div class="tip">手机预览：宽 390px 的客户预约页，和普通预约页共用同一份数据</div>
</body>
</html>
