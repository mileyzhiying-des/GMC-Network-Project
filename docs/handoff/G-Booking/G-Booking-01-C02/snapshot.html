<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>G-Booking-01-C02 ［预约就诊］卡</title>
<link rel="stylesheet" href="base.css">
<style>.demo{display:flex;gap:24px;flex-wrap:wrap;padding:16px;background:#999}
.frame{width:390px;background:var(--bk-page) url('booking-bg.jpg') center top/cover no-repeat}

<body style="background:#999">
<div class="demo">
  <div><p class="cap">印尼文</p><div class="frame"><div class="bk-wrap" style="padding-bottom:16px">

    <button class="bk-home-card primary">
      <span class="bk-home-ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>

    </button>
  </div></div></div>
  <div><p class="cap">中文</p><div class="frame"><div class="bk-wrap" style="padding-bottom:16px">
    <button class="bk-home-card primary">
      <span class="bk-home-ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>
      <span class="bk-home-txt"><b>预约</b><small>选择来院时间</small></span>
      <span class="bk-home-arrow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </button>
  </div></div></div>
</div>
